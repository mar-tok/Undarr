[project]
name = "undarr"
version = "0.1.0"
description = "Self-hosted video transcoding"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "aiosqlite>=0.20.0",
    "pyyaml>=6.0",
    "watchdog>=4.0.0",
    "prometheus-client>=0.21.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["app*", "core*"]