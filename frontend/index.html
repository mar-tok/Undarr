<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undarr</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="layout">
        <nav id="sidebar">
            <h1 id="sidebar-title"><span class="accent">Un</span>darr</h1>
            <button class="nav-item active" data-view="queue"><img src="list.svg" alt="">Queue</button>
            <button class="nav-item" data-view="presets"><img src="sliders.svg" alt="">Presets</button>
            <button class="nav-item" data-view="libraries"><img src="folder.svg" alt="">Libraries</button>
            <button class="nav-item" data-view="settings"><img src="gear.svg" alt="">Settings</button>
            <div id="sidebar-footer">
                <a href="https://github.com/mar-tok/Undarr/issues" target="_blank" rel="noopener">
                    <img src="github-symbol.svg" alt="GitHub">
                    <span>Report an issue</span>
                </a>
                <a href="https://ko-fi.com/martokdev" target="_blank" rel="noopener">
                    <img src="kofi_symbol.svg" alt="Ko-fi">
                    <span>Buy me a coffee</span>
                </a>
                <a id="version-link" href="https://github.com/mar-tok/Undarr/releases" target="_blank" rel="noopener">
                    <span id="version-label"></span>
                    <img id="update-icon" src="dot.svg" alt="Update available" class="hidden">
                </a>
            </div>
        </nav>
        <main id="content">
            <div id="view-queue" class="view active">
                <div class="queue-tabs" id="queue-tabs">
                    <button class="queue-tab active" data-qtab="queue">Queue</button>
                    <button class="queue-tab" data-qtab="issues">Issues</button>
                    <button class="queue-tab" data-qtab="history">History</button>
                    <input type="text" id="queue-search" placeholder="Search...">
                </div>
                <div class="queue-pane active" id="qtab-queue">
                    <div class="queue-controls" id="queue-controls" style="display:none">
                        <button class="btn btn-primary" id="btn-pause">Pause Queue</button>
                        <span id="pending-count"></span>
                    </div>
                    <table id="queue-table" style="display:none">
                        <thead>
                            <tr>
                                <th>File</th>
                                <th>Library</th>
                                <th>Size</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="queue-body"></tbody>
                    </table>
                    <p id="queue-empty">No jobs in queue.</p>
                </div>
                <div class="queue-pane" id="qtab-issues">
                    <table id="issues-table" style="display:none">
                        <thead>
                            <tr>
                                <th>File</th>
                                <th>Library</th>
                                <th>Size</th>
                                <th>Status</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="issues-body"></tbody>
                    </table>
                    <p id="issues-empty">No issues.</p>
                </div>
                <div class="queue-pane" id="qtab-history">
                    <table id="history-table">
                        <thead>
                            <tr>
                                <th class="sortable" data-sort="file_path">File</th>
                                <th class="sortable" data-sort="library_name">Library</th>
                                <th class="sortable" data-sort="old_size_bytes">Old Size</th>
                                <th class="sortable" data-sort="new_size_bytes">New Size</th>
                                <th class="sortable" data-sort="finished_at">Date</th>
                                <th id="history-status-th">Status</th>
                            </tr>
                        </thead>
                        <tbody id="history-body"></tbody>
                    </table>
                    <div class="pagination" id="history-pagination"></div>
                </div>
                <div id="search-results" style="display:none">
                    <table id="search-table">
                        <thead>
                            <tr>
                                <th class="sortable" data-sort="file_path">File</th>
                                <th class="sortable" data-sort="library_name">Library</th>
                                <th class="sortable" data-sort="old_size_bytes">Size</th>
                                <th class="sortable" data-sort="finished_at">Date</th>
                                <th id="search-status-th">Status</th>
                            </tr>
                        </thead>
                        <tbody id="search-body"></tbody>
                    </table>
                    <p id="search-empty" style="display:none">No results.</p>
                    <div class="pagination" id="search-pagination"></div>
                </div>
            </div>

            <div id="view-presets" class="view">
                <button class="btn btn-primary" id="btn-new-preset" style="margin-bottom:16px">New Preset</button>
                <div id="preset-grid"></div>
            </div>

            <div id="view-libraries" class="view">
                <button class="btn btn-primary" id="btn-new-library" style="margin-bottom:16px">New Library</button>
                <div id="library-grid"></div>
            </div>

            <div id="view-settings" class="view">
                <div class="form-group" style="max-width:420px">
                    <label data-tooltip="Temporary files are stored here during transcoding.<br>Requires enough free space for the largest file being processed.<br>Cleaned up automatically after each job.">Cache Directory</label>
                    <div class="path-manual-row">
                        <input type="text" id="set-cache-dir" placeholder="/tmp/undarr">
                        <button class="btn" id="btn-browse-cache" type="button">Browse</button>
                    </div>
                </div>
                <button class="btn btn-primary" id="btn-save-settings" style="margin-bottom:24px">Save</button>
                <h2>Devices</h2>
                <div id="device-grid"></div>
            </div>
        </main>
    </div>
    <div id="tooltip"></div>
    <script type="module" src="app.js"></script>
</body>
</html>
