<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undarr</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="layout">
        <nav id="sidebar">
            <h1><span class="accent">Un</span>darr</h1>
        </nav>
        <main id="content">
            <div class="queue-controls" id="queue-controls" style="display:none">
                <button class="btn btn-primary" id="btn-pause">Pause Queue</button>
                <span id="pending-count"></span>
            </div>
            <table id="queue-table" style="display:none">
                <thead>
                    <tr>
                        <th>File</th>
                        <th>Size</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="queue-body"></tbody>
            </table>
            <p id="queue-empty">No jobs in queue.</p>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
